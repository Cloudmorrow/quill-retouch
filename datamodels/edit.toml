# One edit of one photo: how it is turned, what is kept, how big it comes
# out, and how its last save went. The field names are the photo kit's
# (docs/PHOTO.md in the core), so every surface draws it.

[datamodel]
id = "retouch.edit"
version = 1
label = "Edit"
description = "A photo being edited: turned, mirrored, cropped, made another size, its layers and what is on them, and how it was last saved."
scopes = ["personal"]
title = "name"

[fields]
name = { kind = "string", required = true }
source = { kind = "string", required = true, indexed = true, label = "Photo", description = "The file it is made from, in My Files" }
width = { kind = "int", description = "The photo's width in pixels, as taken; filled in when blank" }
height = { kind = "int", description = "The photo's height in pixels, as taken; filled in when blank" }
rotate = { kind = "int", default = 0, label = "Turn", description = "Quarter turns clockwise, in degrees: 0, 90, 180 or 270" }
mirror = { kind = "bool", default = false, description = "Flipped left to right" }
crop = { kind = "json", description = "The part kept, in percent of the turned picture: {x, y, w, h}; blank keeps all of it" }
out_width = { kind = "int", label = "Width", description = "The saved picture's width in pixels; blank keeps the cropped picture's" }
out_height = { kind = "int", label = "Height", description = "The saved picture's height in pixels; blank keeps the shape" }
layers = { kind = "json", description = "The layers, lowest first: [{id, name, hidden}, …]; blank is one layer. Every element names its layer; one that names none is on the first" }
status = { kind = "enum", values = ["editing", "queued", "rendering", "done", "failed"], labels = ["Editing", "Queued", "Saving", "Saved", "Failed"], default = "editing", indexed = true }
message = { kind = "string", description = "What the renderer last said about it" }
output = { kind = "string", label = "Saved as", description = "The last save: the photo itself, or the new file beside it" }
overwrite = { kind = "bool", default = false, label = "Over the photo", description = "What the last save asked: write over the photo, or a new file beside it" }
save_name = { kind = "string", label = "Save as", description = "What the last save was to be called" }
saved_at = { kind = "datetime", indexed = true, stamp = { field = "status", value = "done" } }
