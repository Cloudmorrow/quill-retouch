# Words laid on an edit's picture: where, how big, which colour. Placed on
# the turned picture before the crop, so cropping keeps them on the same
# part of the photo.

[datamodel]
id = "retouch.text"
version = 1
label = "Text"
description = "Words on an edited photo: where they are, how tall, which colour."
scopes = ["personal"]
title = "text"

[fields]
edit = { kind = "link", to = "retouch.edit", required = true, indexed = true, on_delete = "cascade" }
text = { kind = "string", required = true, label = "Words", description = "A line break starts a new line" }
x = { kind = "decimal", required = true, default = 6, label = "Left", description = "The left edge, in percent of the picture's width" }
y = { kind = "decimal", required = true, default = 6, label = "Top", description = "The top edge, in percent of the picture's height" }
size = { kind = "decimal", default = 6, description = "How tall a line of letters is, in percent of the picture's height" }
colour = { kind = "string", default = "#ffffff", description = "A colour, as #rrggbb" }
