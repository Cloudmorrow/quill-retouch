# Retouch: a simple photo editor, laid out like a picture program. The photos
# in My Files are its material; an edit takes one of them, turns and mirrors
# it, lays layers on it — words, marker strokes, pieces copied and pasted —
# crops it, makes it another size, and saves it over the photo or as a new
# file beside it. The editor is Cloudmorrow's photo kit, drawn on every
# surface; the pictures and the saving come from a service beside the
# server, with the Pillow the server's Python has. See CLAUDE.md for the
# format and the loop.

[quill]
id = "retouch"
name = "Retouch"
version = "2.1.1"
summary = "A simple photo editor for the photos in your drive: crop, turn, resize, draw and write on them in layers, copy and paste, and save over the photo or as a new file."
category = "creative"
icon = "paintbrush"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"
code = "quill.py"
features = [
  "Every photo in My Files is material: Edit this photo, on a photo in Media or Files (and only on a photo), opens it under its own name; so does New, from the photos in the drive",
  "Laid out like a picture program: Resize, Save and how the save went on a bar across the top, tools down the left, the picture in the middle, the tool's options and the layers on the right",
  "Crop by drawing or dragging a box, held to a shape if you like — square, 4 : 3, 3 : 2, 16 : 9, tall — or crop to a selection",
  "Turn by quarter turns, mirror",
  "Marker: draw on the picture in any colour, fine to thick, as a pen or a see-through highlighter",
  "Words on the picture, in the app's own letters: put where you press, dragged into place, sized by their corner, in any colour",
  "Select, first among the tools and the one everything comes back to: press a layer to pick it, drag it, pull its corners; Escape, Done and words just laid all hand back to it",
  "Marquee a part of the picture, copy it, and paste it back as a piece to move and size",
  "Layers: everything you add is one, listed top first, hidden with an eye, brought forward or sent back, duplicated, removed",
  "Resize, on the bar: half, a quarter, a width, or any width and height, in a sheet",
  "Save, on the bar: over the photo (the one before goes to the Trash) or as a new file beside it, as JPEG, PNG or WebP by its name",
  "The same editor on the web and the phone (live), in the terminal (the real picture) and on the command line",
]

# The material and the exports are files in the person's drive.
[uses]
datamodels = ["file"]

# -- screens -------------------------------------------------------------------------
# The edits, and each one in the editor: Cloudmorrow's photo kit (docs/PHOTO.md
# in the core). The photos are the ones in My Files › Photos; looking through
# them is Media's, which Retouch requires and adds Edit this photo to.
[[screens]]
id = "editor"
kit = "photo"
label = "Retouch"
model = "retouch.edit"
title = "name"
layers = "retouch.layer"
media = { share = "my-files", within = "Photos" }
pictures = "pictures"
save = "save"

# -- actions -------------------------------------------------------------------------
# A photo becomes an edit: a button on a photo's sheet — only a photo's,
# by its name — so on one opened in Media or Files. Nothing is asked: the
# edit opens under the photo's own name, and the photo is not touched until
# it is saved over.
[[actions]]
id = "edit-photo"
label = "Edit this photo"
on = "file"
only = { kind = "file", name = ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.webp", "*.bmp", "*.tif", "*.tiff", "*.heic", "*.heif", "*.avif"] }
tone = "primary"
description = "Opens this photo in Retouch, under its own name: the photo itself is not changed until you save over it."

# Save: rendered beside the server, and written over the photo (the one
# before goes to the Trash) or put beside it as a new file. The editor asks
# which and presses this with both answered; the edit says how it goes.
[[actions]]
id = "save"
label = "Save"
on = "retouch.edit"
tone = "primary"
description = "Saves the picture over the photo, or as a new file beside it, by its name's suffix: .jpg, .png or .webp."
[actions.fields]
overwrite = { kind = "bool", default = false, label = "Over the photo", description = "Write over the photo itself; the one before goes to the Trash" }
name = { kind = "string", description = "What to call the new file, suffix and all; the photo's name when writing over it" }

# Draw the screen again: the renderer works beside the server.
[[actions]]
id = "refresh"
label = "Refresh"
assistant = false

# -- the renderer ----------------------------------------------------------------------
# A program beside the server, with Pillow: it answers the pictures API the
# editor's terminal viewer draws from, fills in the sizes the kit leaves
# blank, and does the saving people ask for. It works through the record
# API, as the administrator who installed Retouch.
[[services]]
id = "draw"
command = ["python", "services/picture.py"]
always = true

# The pictures API: /api/q/retouch/pictures/info, /source and /picture.
[[apis]]
id = "pictures"
service = "draw"
prefix = "pictures"

# Media shows the photos in the drive; Retouch edits them. Installing Retouch
# installs Media first; Media needs nothing of Retouch.
[requires]
quills = ["media"]

# The pictures on the catalog's page: the same edit on the three surfaces.
[[screenshots]]
id = "retouch"
caption = "Tools down the left, the picture, and its layers: words, a marker stroke, a pasted piece"
